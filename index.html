<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINNAL MURALI | Netflix Original Film</title>
    <link rel="icon" href="favicon.png" type="image/x-icon">
    
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="lightning" id="lightningFlash"></div>

    <nav>
        <div class="nav-links">
            <li><a href="#hero">The Legend</a></li>
            <li><a href="#cast">Cast</a></li>
        </div>
        <div class="nav-right">
            <button id="muteButton" style="background:none; border:none; color:#fff; cursor:pointer;"><i id="soundIcon" class="fas fa-volume-up"></i></button>
        </div>
    </nav>

    <main class="poster-scene" id="hero">
        <!-- Layer 1: Sky & Vortex -->
        <div class="layer layer-sky" id="layerSky">
            <div class="vortex"></div>
        </div>

        <!-- Layer 2: City Foundation -->
        <div class="layer layer-city" id="layerCity"></div>

        <!-- Layer 3: THE HERO (Standing on Rock) -->
        <div class="layer layer-hero" id="layerHero"></div>

        <!-- Layer 4: Embers -->
        <div class="layer embers"></div>

        <!-- Layer 5: The Original Logo (TOP) -->
        <div class="poster-logo" id="posterLogo">
            <img src="images/minnal-murali-61ec09d44cdd7.png" alt="Minnal Murali">
        </div>

        <!-- Layer 6: Credits & Buttons (BOTTOM) -->
        <div class="poster-footer" id="posterFooter">
            <div class="credits">
                A BASIL JOSEPH FILM • PRODUCED BY SOPHIA PAUL • SCORE BY SUSHIN SHYAM
            </div>
            <div class="poster-btns">
                <a href="https://www.netflix.com/title/81497215" target="_blank" class="btn-netflix">
                    <i class="fas fa-play"></i> Watch Film
                </a>
                <a href="#" class="btn-netflix" style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);">
                    Explore More
                </a>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
